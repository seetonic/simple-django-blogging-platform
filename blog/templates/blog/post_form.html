{% extends "blog/base.html" %}

{% block title %}Write a post{% endblock %}

{% block content %}
    <h2>Write a Post</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'blog:post_list' %}">Cancel</a>
    </form>
{% endblock %}
