{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %} My Blog  {% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url "blog:post_list" %}">My Blog</a></h1>
        <nav>
            {% if user.is_authenticated %}
                Hi, {{ user.username }} | <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" >logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a> | <a href="{% url 'blog:signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
